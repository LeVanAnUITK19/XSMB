name: Crawl XSMB POST
on:
  schedule:
    # 14:00, 14:15, 14:30, 14:45 Viet Nam (UTC+7)
    - cron: '0,15,30,45 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xsmb-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      API_URL: ${{ secrets.API_URL }}
      CRAWLER_API_TOKEN: ${{ secrets.CRAWLER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run crawl:post
